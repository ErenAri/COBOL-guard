[project]
name = "cobol-guard"
version = "0.1.0"
description = "Enterprise-grade COBOL modernization assurance harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "PyJWT>=2.10.0",
  "pydantic>=2.7.0",
  "prometheus-client>=0.21.0",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7.10",
  "build>=1.2.2",
  "cyclonedx-bom>=4.1.0",
  "httpx>=0.27.0",
  "pip-audit>=2.8.0",
  "pytest>=8.0.0",
]

[project.scripts]
gm = "cobol_guard.harness.cli:main"
v2-api = "cobol_guard.candidate.service:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "performance: performance benchmark and throughput validation tests",
]
