name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  release-gate-policy-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python -m pip install pyyaml

      - name: Enforce Release-Gate KMS Default
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path(".github/workflows/release-gate.yml").read_text(encoding="utf-8"))
          on_block = workflow.get("on", workflow.get(True, {}))
          if not isinstance(on_block, dict):
              on_block = {}
          dispatch = on_block.get("workflow_dispatch", {})
          if not isinstance(dispatch, dict):
              dispatch = {}
          inputs = dispatch.get("inputs", {})
          if not isinstance(inputs, dict):
              inputs = {}
          signing_mode = inputs.get("signing_mode")
          if not signing_mode:
              print("release-gate.yml missing workflow_dispatch.inputs.signing_mode", file=sys.stderr)
              sys.exit(2)
          default = signing_mode.get("default")
          options = signing_mode.get("options", [])
          if default != "kms-command":
              print(f"release-gate signing_mode default must be 'kms-command', found: {default!r}", file=sys.stderr)
              sys.exit(2)
          if "kms-command" not in options:
              print("release-gate signing_mode options must include 'kms-command'", file=sys.stderr)
              sys.exit(2)
          print("release-gate signing mode policy check passed")
          PY

  test-and-gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Init Evidence Directory
        run: mkdir -p ci-evidence/test-and-gates

      - name: Unit Tests
        run: pytest -q

      - name: Harness Verify
        run: |
          ORACLE_DIR=$(python -m cobol_guard.harness.cli run --target oracle --case fixtures/cases/basic.yml)
          V2_DIR=$(python -m cobol_guard.harness.cli run --target v2 --case fixtures/cases/basic.yml)
          python -m cobol_guard.harness.cli diff --baseline-dir "$ORACLE_DIR" --candidate-dir "$V2_DIR"
          python -m cobol_guard.harness.cli verify --baseline-dir "$ORACLE_DIR" --candidate-dir "$V2_DIR" --determinism-case fixtures/cases/basic.yml --adapter-parity-case fixtures/cases/basic.yml
          mkdir -p ci-evidence/test-and-gates/basic
          cp "$ORACLE_DIR"/run_manifest.json ci-evidence/test-and-gates/basic/oracle_run_manifest.json
          cp "$V2_DIR"/run_manifest.json ci-evidence/test-and-gates/basic/v2_run_manifest.json
          cp "$V2_DIR"/diff_report.json ci-evidence/test-and-gates/basic/diff_report.json
          cp "$V2_DIR"/verify_report.json ci-evidence/test-and-gates/basic/verify_report.json

      - name: Adversarial Verify
        run: |
          ORACLE_ADV=$(python -m cobol_guard.harness.cli run --target oracle --case fixtures/cases/adversarial.yml)
          V2_ADV=$(python -m cobol_guard.harness.cli run --target v2 --case fixtures/cases/adversarial.yml)
          python -m cobol_guard.harness.cli diff --baseline-dir "$ORACLE_ADV" --candidate-dir "$V2_ADV"
          python -m cobol_guard.harness.cli verify --baseline-dir "$ORACLE_ADV" --candidate-dir "$V2_ADV"
          mkdir -p ci-evidence/test-and-gates/adversarial
          cp "$ORACLE_ADV"/run_manifest.json ci-evidence/test-and-gates/adversarial/oracle_run_manifest.json
          cp "$V2_ADV"/run_manifest.json ci-evidence/test-and-gates/adversarial/v2_run_manifest.json
          cp "$V2_ADV"/diff_report.json ci-evidence/test-and-gates/adversarial/diff_report.json
          cp "$V2_ADV"/verify_report.json ci-evidence/test-and-gates/adversarial/verify_report.json

      - name: Adversarial Restart Verify
        run: |
          set +e
          python -m cobol_guard.harness.cli run --target v2 --case fixtures/cases/adversarial_restart.yml --run-id ci-adversarial-restart --fail-after-chunks 2
          FAIL_CODE=$?
          set -e
          if [ "$FAIL_CODE" -eq 0 ]; then
            echo "Expected simulated failure for restart test, but command succeeded."
            exit 1
          fi
          V2_RESTART=$(python -m cobol_guard.harness.cli run --target v2 --case fixtures/cases/adversarial_restart.yml --run-id ci-adversarial-restart --resume)
          ORACLE_RESTART=$(python -m cobol_guard.harness.cli run --target oracle --case fixtures/cases/adversarial_restart.yml)
          python -m cobol_guard.harness.cli diff --baseline-dir "$ORACLE_RESTART" --candidate-dir "$V2_RESTART"
          python -m cobol_guard.harness.cli verify --baseline-dir "$ORACLE_RESTART" --candidate-dir "$V2_RESTART"
          python -c "import json; m=json.load(open('${V2_RESTART}/run_manifest.json')); r=m['batch_restart']; assert r['reworked_chunks'] <= 1, r"
          mkdir -p ci-evidence/test-and-gates/adversarial_restart
          cp "$ORACLE_RESTART"/run_manifest.json ci-evidence/test-and-gates/adversarial_restart/oracle_run_manifest.json
          cp "$V2_RESTART"/run_manifest.json ci-evidence/test-and-gates/adversarial_restart/v2_run_manifest.json
          cp "$V2_RESTART"/diff_report.json ci-evidence/test-and-gates/adversarial_restart/diff_report.json
          cp "$V2_RESTART"/verify_report.json ci-evidence/test-and-gates/adversarial_restart/verify_report.json

      - name: Governance Promotion
        run: |
          python -m cobol_guard.harness.cli bless --baseline candidate --target oracle --case fixtures/cases/basic.yml --change-class bug_fix --ticket CI-1 --risk-statement "ci validation" --author ci
          python -m cobol_guard.harness.cli keygen --name ci_approver_a
          python -m cobol_guard.harness.cli keygen --name ci_approver_b
          python -m cobol_guard.harness.cli sign-manifest --manifest baselines/candidate/basic/baseline_manifest.json --key governance/keys/ci_approver_a.private.pem
          python -m cobol_guard.harness.cli sign-manifest --manifest baselines/candidate/basic/baseline_manifest.json --key governance/keys/ci_approver_b.private.pem
          python -m cobol_guard.harness.cli promote-baseline --manifest baselines/candidate/basic/baseline_manifest.json --signature baselines/candidate/basic/baseline_manifest.ci_approver_a.sig.json --signature baselines/candidate/basic/baseline_manifest.ci_approver_b.sig.json

      - name: Upload Evidence (Test And Gates)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-test-and-gates
          path: ci-evidence/test-and-gates
          if-no-files-found: warn

  packaging-proof:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Init Evidence Directory
        run: mkdir -p ci-evidence/packaging

      - name: Build Distributions
        run: python -m build

      - name: Wheel Smoke Install
        run: |
          python -m venv wheel-venv
          . wheel-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m cobol_guard.harness.cli --help

      - name: Sdist Smoke Install
        run: |
          python -m venv sdist-venv
          . sdist-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz
          python -m cobol_guard.harness.cli --help

      - name: Capture Packaging Proof
        run: |
          python -m pip inspect > ci-evidence/packaging/dependency_inspect.json
          python - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path

          def sha256_file(path: Path) -> str:
              hasher = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(65536), b""):
                      hasher.update(chunk)
              return hasher.hexdigest()

          dist_dir = Path("dist")
          wheel = sorted(path.name for path in dist_dir.glob("*.whl"))
          sdist = sorted(path.name for path in dist_dir.glob("*.tar.gz"))
          payload = {
              "wheel_artifacts": wheel,
              "sdist_artifacts": sdist,
              "wheel_smoke_check": "passed",
              "sdist_smoke_check": "passed",
          }
          Path("ci-evidence/packaging/packaging_proof.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          provenance = {
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "wheel_hashes": {path.name: sha256_file(path) for path in sorted(dist_dir.glob("*.whl"))},
              "sdist_hashes": {path.name: sha256_file(path) for path in sorted(dist_dir.glob("*.tar.gz"))},
              "dependency_inspect_path": "ci-evidence/packaging/dependency_inspect.json",
              "packaging_proof_path": "ci-evidence/packaging/packaging_proof.json",
          }
          Path("ci-evidence/packaging/build_provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Evidence (Packaging)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-packaging
          path: ci-evidence/packaging
          if-no-files-found: warn

  service-proof:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Init Evidence Directory
        run: mkdir -p ci-evidence/service

      - name: Run Service Tests
        run: pytest -q tests/test_service_contract.py tests/test_service_api.py

      - name: Live Service Smoke
        run: |
          export COBOL_GUARD_DATABASE_URL="sqlite+pysqlite:///$(pwd)/service-proof.db"
          export COBOL_GUARD_AUTH_MODE=hs256
          export COBOL_GUARD_JWT_HS256_SECRET=service-proof-secret
          export COBOL_GUARD_JWT_ISSUER=cobol-guard-ci
          export COBOL_GUARD_JWT_AUDIENCE=cobol-guard-api
          python -m uvicorn cobol_guard.candidate.service:app --host 127.0.0.1 --port 8001 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          import httpx
          import jwt

          base_url = "http://127.0.0.1:8001"
          client = httpx.Client(timeout=5.0)
          for _ in range(50):
              try:
                  response = client.get(f"{base_url}/healthz")
                  if response.status_code == 200:
                      break
              except Exception:
                  time.sleep(0.2)
          else:
              raise SystemExit("service did not become healthy")

          token = jwt.encode(
              {
                  "sub": "service-proof",
                  "scope": "ledger.read ledger.write ops.metrics",
                  "iss": "cobol-guard-ci",
                  "aud": "cobol-guard-api",
              },
              "service-proof-secret",
              algorithm="HS256",
          )
          headers = {"Authorization": f"Bearer {token}"}

          ready = client.get(f"{base_url}/readyz")
          post = client.post(
              f"{base_url}/transactions/post",
              headers=headers,
              json={
                  "request_id": "REQ1",
                  "account_id": "ACC000000001",
                  "amount_cents": 1000,
                  "business_date": "20260110",
                  "event_time": "20260110120000",
              },
          )
          balance = client.get(f"{base_url}/accounts/ACC000000001/balance", headers=headers)
          metrics = client.get(f"{base_url}/metrics", headers=headers)
          payload = {
              "ready_status": ready.status_code,
              "post_status": post.status_code,
              "post_body": post.json(),
              "balance_status": balance.status_code,
              "balance_body": balance.json(),
              "metrics_status": metrics.status_code,
          }
          Path("ci-evidence/service/live_service_smoke.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          assert ready.status_code == 200, ready.text
          assert post.status_code == 200, post.text
          assert balance.status_code == 200, balance.text
          assert metrics.status_code == 200, metrics.text
          PY

      - name: Upload Evidence (Service)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-service
          path: ci-evidence/service
          if-no-files-found: warn

  security-proof:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Init Evidence Directory
        run: mkdir -p ci-evidence/security

      - name: Run Dependency Audit
        run: |
          set +e
          pip-audit --local --format json --progress-spinner off > ci-evidence/security/pip_audit.json
          EXIT_CODE=$?
          set -e
          echo "$EXIT_CODE" > ci-evidence/security/pip_audit_exit_code.txt
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("ci-evidence/security/pip_audit.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          Path("ci-evidence/security/pip_audit_summary.json").write_text(
              json.dumps({
                  "dependency_count": len(payload.get("dependencies", [])),
                  "vulnerability_count": len(payload.get("vulnerabilities", [])),
                  "pip_audit_exit_code": int(Path("ci-evidence/security/pip_audit_exit_code.txt").read_text(encoding="utf-8").strip()),
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run Bandit Scan
        run: |
          bandit -r src -f json -o ci-evidence/security/bandit.json --exit-zero
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("ci-evidence/security/bandit.json").read_text(encoding="utf-8"))
          summary = {
              "issue_count": len(payload.get("results", [])),
              "high_severity": payload.get("metrics", {}).get("_totals", {}).get("SEVERITY.HIGH", 0),
              "medium_severity": payload.get("metrics", {}).get("_totals", {}).get("SEVERITY.MEDIUM", 0),
              "low_severity": payload.get("metrics", {}).get("_totals", {}).get("SEVERITY.LOW", 0),
          }
          Path("ci-evidence/security/bandit_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build SBOM
        run: |
          cyclonedx-py environment --output-reproducible --of JSON -o ci-evidence/security/sbom.json

      - name: Upload Evidence (Security)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-security
          path: ci-evidence/security
          if-no-files-found: warn

  cobol-executable-parity:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install GnuCOBOL
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
          cobc --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Init Evidence Directory
        run: mkdir -p ci-evidence/cobol-executable

      - name: COBOL Executable Parity Verify
        env:
          COBOL_GUARD_ORACLE_MODE: cobol-executable
          COBOL_GUARD_COBOL_SOURCE: programs/v1/LEDGER01.cbl
          COBOL_GUARD_COBOL_BUILD_DIR: build/cobol
        run: |
          ORACLE_DIR=$(python -m cobol_guard.harness.cli run --target oracle --case fixtures/cases/basic.yml)
          V2_DIR=$(python -m cobol_guard.harness.cli run --target v2 --case fixtures/cases/basic.yml)
          python -m cobol_guard.harness.cli diff --baseline-dir "$ORACLE_DIR" --candidate-dir "$V2_DIR"
          python -m cobol_guard.harness.cli verify --baseline-dir "$ORACLE_DIR" --candidate-dir "$V2_DIR"
          mkdir -p ci-evidence/cobol-executable/basic
          cp "$ORACLE_DIR"/run_manifest.json ci-evidence/cobol-executable/basic/oracle_run_manifest.json
          cp "$V2_DIR"/run_manifest.json ci-evidence/cobol-executable/basic/v2_run_manifest.json
          cp "$V2_DIR"/diff_report.json ci-evidence/cobol-executable/basic/diff_report.json
          cp "$V2_DIR"/verify_report.json ci-evidence/cobol-executable/basic/verify_report.json

      - name: COBOL Executable Adversarial Parity Verify
        env:
          COBOL_GUARD_ORACLE_MODE: cobol-executable
          COBOL_GUARD_COBOL_SOURCE: programs/v1/LEDGER01.cbl
          COBOL_GUARD_COBOL_BUILD_DIR: build/cobol
        run: |
          ORACLE_ADV=$(python -m cobol_guard.harness.cli run --target oracle --case fixtures/cases/adversarial.yml)
          V2_ADV=$(python -m cobol_guard.harness.cli run --target v2 --case fixtures/cases/adversarial.yml)
          python -m cobol_guard.harness.cli diff --baseline-dir "$ORACLE_ADV" --candidate-dir "$V2_ADV"
          python -m cobol_guard.harness.cli verify --baseline-dir "$ORACLE_ADV" --candidate-dir "$V2_ADV"
          mkdir -p ci-evidence/cobol-executable/adversarial
          cp "$ORACLE_ADV"/run_manifest.json ci-evidence/cobol-executable/adversarial/oracle_run_manifest.json
          cp "$V2_ADV"/run_manifest.json ci-evidence/cobol-executable/adversarial/v2_run_manifest.json
          cp "$V2_ADV"/diff_report.json ci-evidence/cobol-executable/adversarial/diff_report.json
          cp "$V2_ADV"/verify_report.json ci-evidence/cobol-executable/adversarial/verify_report.json

      - name: COBOL Executable Determinism Gate
        env:
          COBOL_GUARD_ORACLE_MODE: cobol-executable
          COBOL_GUARD_COBOL_SOURCE: programs/v1/LEDGER01.cbl
          COBOL_GUARD_COBOL_BUILD_DIR: build/cobol
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          case_path = "fixtures/cases/basic.yml"
          runs = []
          hashes = []
          output_dir = Path("ci-evidence/cobol-executable/determinism")
          output_dir.mkdir(parents=True, exist_ok=True)

          for _ in range(5):
              run_dir = subprocess.check_output(
                  ["python", "-m", "cobol_guard.harness.cli", "run", "--target", "oracle", "--case", case_path],
                  text=True,
              ).strip()
              manifest = json.loads((Path(run_dir) / "run_manifest.json").read_text(encoding="utf-8"))
              triplet = (
                  manifest["artifact_hashes"]["ledger_journal.dat"],
                  manifest["artifact_hashes"]["reconcile_totals.dat"],
                  manifest["artifact_hashes"]["exception_report.dat"],
              )
              runs.append(run_dir)
              hashes.append(triplet)

          unique_hashes = sorted({"|".join(item) for item in hashes})
          summary = {
              "case": case_path,
              "repeats": len(runs),
              "run_dirs": runs,
              "hash_triplets": [list(item) for item in hashes],
              "unique_hash_triplets": unique_hashes,
              "passed": len(unique_hashes) == 1,
          }
          (output_dir / "determinism_summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          if len(unique_hashes) != 1:
              print("cobol_executable_determinism_failed", file=sys.stderr)
              sys.exit(2)
          PY

      - name: Upload Evidence (COBOL Executable)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-cobol-executable
          path: ci-evidence/cobol-executable
          if-no-files-found: warn

  performance-gates:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Init Evidence Directory
        run: mkdir -p ci-evidence/performance

      - name: Run Full Benchmark And Assert Gates
        run: |
          python -m cobol_guard.harness.cli benchmark --case fixtures/cases/basic.yml --profile benchmark/profile.yml --output ci-evidence/performance/benchmark_report.json --assert-gates

      - name: Upload Evidence (Performance)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-performance
          path: ci-evidence/performance
          if-no-files-found: warn
