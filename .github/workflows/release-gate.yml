name: Release Gate

on:
  workflow_dispatch:
    inputs:
      case_path:
        description: "Case fixture path to verify and bless"
        required: true
        default: "fixtures/cases/basic.yml"
      oracle_mode:
        description: "Oracle mode used for release verification"
        required: true
        default: "cobol-executable"
        type: choice
        options:
          - cobol-executable
          - python-reference
      cloud_provider:
        description: "Immutable storage and OIDC provider"
        required: true
        default: "gcp"
        type: choice
        options:
          - gcp
          - aws
      signing_mode:
        description: "Signing mode for release manifests"
        required: true
        default: "kms-command"
        type: choice
        options:
          - kms-command
          - pem-secret
      change_class:
        description: "Change class for baseline rationale"
        required: true
        default: "bug_fix"
      ticket:
        description: "Approval/change ticket id"
        required: true
      risk_statement:
        description: "Risk statement for baseline manifest"
        required: true
      author:
        description: "Baseline author id"
        required: true
      evidence_pack_id:
        description: "Evidence pack id"
        required: true
        default: "v0.1"
      kms_key_version:
        description: "Optional KMS key version metadata"
        required: false
        default: ""
      immutable_bucket:
        description: "Immutable evidence bucket name (GCS or S3)"
        required: false
        default: ""
      immutable_prefix:
        description: "Immutable evidence object prefix"
        required: false
        default: "golden-evidence"
      immutable_retention_days:
        description: "Immutable retention days"
        required: false
        default: "365"

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Require Successful CI On Commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflowId = "ci.yml";
            const headSha = context.sha;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowId,
              head_sha: headSha,
              per_page: 20
            });
            const successRun = runs.data.workflow_runs.find(
              (run) => run.status === "completed" && run.conclusion === "success"
            );
            if (!successRun) {
              core.setFailed(`No successful CI run found for commit ${headSha}. Run CI and retry release gate.`);
              return;
            }
            core.info(`Found successful CI run #${successRun.run_number} for ${headSha}.`);

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Install GnuCOBOL
        if: ${{ inputs.oracle_mode == 'cobol-executable' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol
          cobc --version

      - name: Validate Cloud Identity Configuration
        run: |
          if [ "${{ inputs.cloud_provider }}" = "aws" ]; then
            if [ -z "${AWS_ROLE_TO_ASSUME}" ] || [ -z "${AWS_REGION}" ]; then
              echo "AWS mode requires AWS_ROLE_TO_ASSUME and AWS_REGION."
              exit 2
            fi
          elif [ "${{ inputs.cloud_provider }}" = "gcp" ]; then
            if [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ] || [ -z "${GCP_SERVICE_ACCOUNT}" ]; then
              echo "GCP mode requires GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT."
              exit 2
            fi
          else
            echo "Unsupported cloud_provider: ${{ inputs.cloud_provider }}"
            exit 2
          fi

      - name: Configure AWS Credentials (OIDC)
        if: ${{ inputs.cloud_provider == 'aws' }}
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure GCP Credentials (OIDC)
        if: ${{ inputs.cloud_provider == 'gcp' }}
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: ${{ inputs.cloud_provider == 'gcp' }}
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Ensure AWS CLI
        if: ${{ inputs.cloud_provider == 'aws' }}
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y awscli
          fi
          aws --version

      - name: Ensure gcloud CLI
        if: ${{ inputs.cloud_provider == 'gcp' }}
        run: gcloud --version

      - name: Resolve Immutable Storage Target
        id: immutable
        env:
          CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
          INPUT_BUCKET: ${{ inputs.immutable_bucket }}
          SECRET_BUCKET: ${{ secrets.IMMUTABLE_EVIDENCE_BUCKET }}
          INPUT_PREFIX: ${{ inputs.immutable_prefix }}
          SECRET_PREFIX: ${{ secrets.IMMUTABLE_EVIDENCE_PREFIX }}
        run: |
          BUCKET="${INPUT_BUCKET:-$SECRET_BUCKET}"
          PREFIX="${INPUT_PREFIX:-$SECRET_PREFIX}"
          if [ -z "$BUCKET" ]; then
            echo "Missing immutable bucket: set workflow input immutable_bucket or secret IMMUTABLE_EVIDENCE_BUCKET."
            exit 2
          fi
          if [ -z "$PREFIX" ]; then
            PREFIX="golden-evidence"
          fi
          KEY="${PREFIX}/${GITHUB_SHA}/${{ inputs.evidence_pack_id }}.zip"
          if [ "${CLOUD_PROVIDER}" = "gcp" ]; then
            URI="gs://${BUCKET}/${KEY}"
          elif [ "${CLOUD_PROVIDER}" = "aws" ]; then
            URI="s3://${BUCKET}/${KEY}"
          else
            echo "Unsupported cloud_provider: ${CLOUD_PROVIDER}"
            exit 2
          fi
          echo "provider=${CLOUD_PROVIDER}" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "uri=$URI" >> "$GITHUB_OUTPUT"

      - name: Init Release Evidence Directory
        run: mkdir -p release-evidence

      - name: Capture Security Evidence
        run: |
          mkdir -p release-evidence/security
          set +e
          pip-audit --local --format json --progress-spinner off > release-evidence/security/pip_audit.json
          PIP_AUDIT_EXIT=$?
          set -e
          echo "$PIP_AUDIT_EXIT" > release-evidence/security/pip_audit_exit_code.txt
          bandit -r src -f json -o release-evidence/security/bandit.json --exit-zero
          cyclonedx-py environment --output-reproducible --of JSON -o release-evidence/security/sbom.json
          python - <<'PY'
          import json
          from pathlib import Path

          pip_audit = json.loads(Path("release-evidence/security/pip_audit.json").read_text(encoding="utf-8"))
          bandit = json.loads(Path("release-evidence/security/bandit.json").read_text(encoding="utf-8"))
          summary = {
              "pip_audit_dependencies": len(pip_audit.get("dependencies", [])),
              "pip_audit_vulnerabilities": len(pip_audit.get("vulnerabilities", [])),
              "pip_audit_exit_code": int(
                  Path("release-evidence/security/pip_audit_exit_code.txt").read_text(encoding="utf-8").strip()
              ),
              "bandit_issue_count": len(bandit.get("results", [])),
              "bandit_high_severity": bandit.get("metrics", {}).get("_totals", {}).get("SEVERITY.HIGH", 0),
          }
          Path("release-evidence/security/security_summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run Release Verification And Bless Candidate Baseline
        id: preflight
        run: |
          export COBOL_GUARD_SIGNING_MODE="${{ inputs.signing_mode }}"
          export COBOL_GUARD_KMS_KEY_VERSION="${{ inputs.kms_key_version }}"
          export COBOL_GUARD_ENVIRONMENT="production"
          export COBOL_GUARD_PROVENANCE_REF="github://${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          export COBOL_GUARD_WORKFLOW_RUN_ID="${GITHUB_RUN_ID}"

          if [ "${{ inputs.oracle_mode }}" = "cobol-executable" ]; then
            export COBOL_GUARD_ORACLE_MODE=cobol-executable
            export COBOL_GUARD_COBOL_SOURCE=programs/v1/LEDGER01.cbl
            export COBOL_GUARD_COBOL_BUILD_DIR=build/cobol
          else
            export COBOL_GUARD_ORACLE_MODE=python-reference
          fi

          mkdir -p release-evidence/preflight
          python -m cobol_guard.harness.cli benchmark \
            --case "${{ inputs.case_path }}" \
            --profile benchmark/profile.yml \
            --output release-evidence/preflight/benchmark_report.json \
            --assert-gates

          ORACLE_DIR=$(python -m cobol_guard.harness.cli run --target oracle --case "${{ inputs.case_path }}")
          V2_DIR=$(python -m cobol_guard.harness.cli run --target v2 --case "${{ inputs.case_path }}")
          python -m cobol_guard.harness.cli diff --baseline-dir "$ORACLE_DIR" --candidate-dir "$V2_DIR"
          python -m cobol_guard.harness.cli verify --baseline-dir "$ORACLE_DIR" --candidate-dir "$V2_DIR" --determinism-case "${{ inputs.case_path }}" --adapter-parity-case "${{ inputs.case_path }}" --benchmark-report release-evidence/preflight/benchmark_report.json --require-benchmark

          cp "$ORACLE_DIR"/run_manifest.json release-evidence/preflight/oracle_run_manifest.json
          cp "$V2_DIR"/run_manifest.json release-evidence/preflight/v2_run_manifest.json
          cp "$V2_DIR"/diff_report.json release-evidence/preflight/diff_report.json
          cp "$V2_DIR"/verify_report.json release-evidence/preflight/verify_report.json
          python - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path

          def sha256_file(path: Path) -> str:
              hasher = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(65536), b""):
                      hasher.update(chunk)
              return hasher.hexdigest()

          attestation = {
              "benchmark_required": True,
              "benchmark_report_path": "release-evidence/preflight/benchmark_report.json",
              "verify_report_path": "release-evidence/preflight/verify_report.json",
              "diff_report_path": "release-evidence/preflight/diff_report.json",
              "oracle_run_manifest_path": "release-evidence/preflight/oracle_run_manifest.json",
              "candidate_run_manifest_path": "release-evidence/preflight/v2_run_manifest.json",
          }
          Path("release-evidence/preflight/release_control_attestation.json").write_text(
              json.dumps(attestation, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          provenance = {
              "commit_sha": os.environ.get("GITHUB_SHA", ""),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "benchmark_report_sha256": sha256_file(Path("release-evidence/preflight/benchmark_report.json")),
              "diff_report_sha256": sha256_file(Path("release-evidence/preflight/diff_report.json")),
              "verify_report_sha256": sha256_file(Path("release-evidence/preflight/verify_report.json")),
              "release_control_attestation_sha256": sha256_file(
                  Path("release-evidence/preflight/release_control_attestation.json")
              ),
          }
          Path("release-evidence/preflight/build_provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          BLESS_DIR=$(python -m cobol_guard.harness.cli bless --baseline candidate --target oracle --case "${{ inputs.case_path }}" --change-class "${{ inputs.change_class }}" --ticket "${{ inputs.ticket }}" --risk-statement "${{ inputs.risk_statement }}" --author "${{ inputs.author }}")
          mkdir -p release-evidence/candidate-baseline
          cp "$BLESS_DIR"/baseline_manifest.json release-evidence/candidate-baseline/baseline_manifest.json
          cp "$BLESS_DIR"/run_manifest.json release-evidence/candidate-baseline/run_manifest.json
          cp "$BLESS_DIR"/diff_report.json release-evidence/candidate-baseline/diff_report.json
          cp "$BLESS_DIR"/invariant_report.json release-evidence/candidate-baseline/invariant_report.json

          echo "baseline_dir=$BLESS_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare Signing Material
        env:
          SIGN_CMD_A: ${{ secrets.RELEASE_SIGNER_A_KMS_SIGN_COMMAND }}
          SIGN_CMD_B: ${{ secrets.RELEASE_SIGNER_B_KMS_SIGN_COMMAND }}
        run: |
          if [ "${{ inputs.signing_mode }}" = "pem-secret" ]; then
            if [ -z "${{ secrets.RELEASE_SIGNER_A_PRIVATE_KEY_PEM }}" ] || [ -z "${{ secrets.RELEASE_SIGNER_B_PRIVATE_KEY_PEM }}" ]; then
              echo "Missing RELEASE_SIGNER_A_PRIVATE_KEY_PEM or RELEASE_SIGNER_B_PRIVATE_KEY_PEM secret."
              exit 2
            fi
            printf "%s\n" "${{ secrets.RELEASE_SIGNER_A_PRIVATE_KEY_PEM }}" > "$RUNNER_TEMP/release_signer_a.private.pem"
            printf "%s\n" "${{ secrets.RELEASE_SIGNER_B_PRIVATE_KEY_PEM }}" > "$RUNNER_TEMP/release_signer_b.private.pem"
            chmod 600 "$RUNNER_TEMP/release_signer_a.private.pem" "$RUNNER_TEMP/release_signer_b.private.pem"
          else
            if [ -z "$SIGN_CMD_A" ] || [ -z "$SIGN_CMD_B" ]; then
              echo "Missing RELEASE_SIGNER_A_KMS_SIGN_COMMAND or RELEASE_SIGNER_B_KMS_SIGN_COMMAND secret for kms-command mode."
              exit 2
            fi
          fi

          if [ ! -f governance/keys/release_signer_a.public.pem ]; then
            if [ -z "${{ secrets.RELEASE_SIGNER_A_PUBLIC_KEY_PEM }}" ]; then
              echo "Missing governance/keys/release_signer_a.public.pem and RELEASE_SIGNER_A_PUBLIC_KEY_PEM secret."
              exit 2
            fi
            printf "%s\n" "${{ secrets.RELEASE_SIGNER_A_PUBLIC_KEY_PEM }}" > governance/keys/release_signer_a.public.pem
          fi
          if [ ! -f governance/keys/release_signer_b.public.pem ]; then
            if [ -z "${{ secrets.RELEASE_SIGNER_B_PUBLIC_KEY_PEM }}" ]; then
              echo "Missing governance/keys/release_signer_b.public.pem and RELEASE_SIGNER_B_PUBLIC_KEY_PEM secret."
              exit 2
            fi
            printf "%s\n" "${{ secrets.RELEASE_SIGNER_B_PUBLIC_KEY_PEM }}" > governance/keys/release_signer_b.public.pem
          fi

      - name: Sign Baseline Manifest
        id: signatures
        env:
          SIGN_CMD_A: ${{ secrets.RELEASE_SIGNER_A_KMS_SIGN_COMMAND }}
          SIGN_CMD_B: ${{ secrets.RELEASE_SIGNER_B_KMS_SIGN_COMMAND }}
        run: |
          MANIFEST_PATH="${{ steps.preflight.outputs.baseline_dir }}/baseline_manifest.json"
          SIG_A="${{ steps.preflight.outputs.baseline_dir }}/baseline_manifest.release_signer_a.sig.json"
          SIG_B="${{ steps.preflight.outputs.baseline_dir }}/baseline_manifest.release_signer_b.sig.json"

          if [ "${{ inputs.signing_mode }}" = "pem-secret" ]; then
            python -m cobol_guard.harness.cli sign-manifest --manifest "$MANIFEST_PATH" --key "$RUNNER_TEMP/release_signer_a.private.pem" --key-id release_signer_a --output "$SIG_A"
            python -m cobol_guard.harness.cli sign-manifest --manifest "$MANIFEST_PATH" --key "$RUNNER_TEMP/release_signer_b.private.pem" --key-id release_signer_b --output "$SIG_B"
          else
            python -m cobol_guard.harness.cli kms-sign-manifest --manifest "$MANIFEST_PATH" --key-id release_signer_a --command-template "$SIGN_CMD_A" --output "$SIG_A"
            python -m cobol_guard.harness.cli kms-sign-manifest --manifest "$MANIFEST_PATH" --key-id release_signer_b --command-template "$SIGN_CMD_B" --output "$SIG_B"
          fi

          mkdir -p release-evidence/signatures
          cp "$SIG_A" release-evidence/signatures/
          cp "$SIG_B" release-evidence/signatures/

          echo "manifest_path=$MANIFEST_PATH" >> "$GITHUB_OUTPUT"
          echo "signature_a=$SIG_A" >> "$GITHUB_OUTPUT"
          echo "signature_b=$SIG_B" >> "$GITHUB_OUTPUT"

      - name: Verify Baseline Manifest Signatures
        run: |
          python tools/verify_signed_manifest.py \
            --manifest "${{ steps.signatures.outputs.manifest_path }}" \
            --signature "${{ steps.signatures.outputs.signature_a }}" \
            --signature "${{ steps.signatures.outputs.signature_b }}" \
            --keys-dir governance/keys \
            --min-valid 2 \
            --require-key-id release_signer_a \
            --require-key-id release_signer_b \
            --output release-evidence/signatures/baseline_signature_verification.json

      - name: Promote Baseline
        run: |
          python -m cobol_guard.harness.cli promote-baseline --manifest "${{ steps.signatures.outputs.manifest_path }}" --signature "${{ steps.signatures.outputs.signature_a }}" --signature "${{ steps.signatures.outputs.signature_b }}"
          CASE_ID=$(python -c "import json; print(json.load(open('${{ steps.signatures.outputs.manifest_path }}', encoding='utf-8'))['case_id'])")
          mkdir -p release-evidence/locked-baseline
          cp "baselines/locked/${CASE_ID}/baseline_manifest.json" release-evidence/locked-baseline/baseline_manifest.json
          cp "baselines/locked/${CASE_ID}/run_manifest.json" release-evidence/locked-baseline/run_manifest.json
          cp "baselines/locked/${CASE_ID}/diff_report.json" release-evidence/locked-baseline/diff_report.json
          cp "baselines/locked/${CASE_ID}/invariant_report.json" release-evidence/locked-baseline/invariant_report.json

      - name: Build And Sign Evidence Pack
        id: pack
        env:
          SIGN_CMD_A: ${{ secrets.RELEASE_SIGNER_A_KMS_SIGN_COMMAND }}
          SIGN_CMD_B: ${{ secrets.RELEASE_SIGNER_B_KMS_SIGN_COMMAND }}
        run: |
          PACK_ID="${{ inputs.evidence_pack_id }}"
          python -m cobol_guard.harness.cli evidence-pack --pack-id "$PACK_ID" --include release-evidence --include SPEC.md --include governance/gate_policy.yml --include schema-registry --output-dir dist/evidence --retention-class "regulated-7y" --immutability-proof-ref "${{ steps.immutable.outputs.uri }}" --provenance-ref "github://${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PACK_MANIFEST="dist/evidence/${PACK_ID}/evidence_manifest.json"
          if [ "${{ inputs.signing_mode }}" = "pem-secret" ]; then
            python -m cobol_guard.harness.cli sign-manifest --manifest "$PACK_MANIFEST" --key "$RUNNER_TEMP/release_signer_a.private.pem" --key-id release_signer_a --output "dist/evidence/${PACK_ID}/evidence_manifest.release_signer_a.sig.json"
            python -m cobol_guard.harness.cli sign-manifest --manifest "$PACK_MANIFEST" --key "$RUNNER_TEMP/release_signer_b.private.pem" --key-id release_signer_b --output "dist/evidence/${PACK_ID}/evidence_manifest.release_signer_b.sig.json"
          else
            python -m cobol_guard.harness.cli kms-sign-manifest --manifest "$PACK_MANIFEST" --key-id release_signer_a --command-template "$SIGN_CMD_A" --output "dist/evidence/${PACK_ID}/evidence_manifest.release_signer_a.sig.json"
            python -m cobol_guard.harness.cli kms-sign-manifest --manifest "$PACK_MANIFEST" --key-id release_signer_b --command-template "$SIGN_CMD_B" --output "dist/evidence/${PACK_ID}/evidence_manifest.release_signer_b.sig.json"
          fi

          python -m cobol_guard.harness.cli verify-evidence-pack --pack-dir "dist/evidence/${PACK_ID}" --keys-dir governance/keys --signature "dist/evidence/${PACK_ID}/evidence_manifest.release_signer_a.sig.json" --signature "dist/evidence/${PACK_ID}/evidence_manifest.release_signer_b.sig.json" --min-valid 2 --require-key-id release_signer_a --require-key-id release_signer_b --output release-evidence/evidence_pack_signature_verification.json

          echo "pack_id=$PACK_ID" >> "$GITHUB_OUTPUT"

      - name: Upload Evidence Pack To Immutable Storage
        id: immutable_upload
        env:
          PROVIDER: ${{ steps.immutable.outputs.provider }}
          BUCKET: ${{ steps.immutable.outputs.bucket }}
          KEY: ${{ steps.immutable.outputs.key }}
          URI: ${{ steps.immutable.outputs.uri }}
          RETENTION_DAYS: ${{ inputs.immutable_retention_days }}
        run: |
          RETENTION_UNTIL=$(date -u -d "+${RETENTION_DAYS} days" '+%Y-%m-%dT%H:%M:%SZ')
          mkdir -p release-evidence/immutable
          if [ "${PROVIDER}" = "aws" ]; then
            aws s3api put-object \
              --bucket "$BUCKET" \
              --key "$KEY" \
              --body "dist/evidence/${{ steps.pack.outputs.pack_id }}.zip" \
              --object-lock-mode GOVERNANCE \
              --object-lock-retain-until-date "$RETENTION_UNTIL" \
              > release-evidence/immutable/upload_result.json

            VERSION_ID=$(python -c "import json;print(json.load(open('release-evidence/immutable/upload_result.json',encoding='utf-8')).get('VersionId',''))")
            ETAG=$(python -c "import json;print(json.load(open('release-evidence/immutable/upload_result.json',encoding='utf-8')).get('ETag',''))")
            python -c "import json; p={'cloud_provider':'aws','immutable_ref':'${URI}','bucket':'${BUCKET}','key':'${KEY}','version_id':'${VERSION_ID}','etag':'${ETAG}','retention_days':'${RETENTION_DAYS}','retention_until_utc':'${RETENTION_UNTIL}'}; open('release-evidence/immutable/immutability_proof.json','w',encoding='utf-8').write(json.dumps(p,indent=2,sort_keys=True)+'\\n')"
          elif [ "${PROVIDER}" = "gcp" ]; then
            gcloud storage cp \
              "dist/evidence/${{ steps.pack.outputs.pack_id }}.zip" \
              "${URI}" \
              --if-generation-match=0 \
              --retain-until="${RETENTION_UNTIL}" \
              --retention-mode=Locked
            gcloud storage objects describe "${URI}" --format=json > release-evidence/immutable/upload_result.json

            GENERATION=$(python -c "import json;print(json.load(open('release-evidence/immutable/upload_result.json',encoding='utf-8')).get('generation',''))")
            METAGENERATION=$(python -c "import json;print(json.load(open('release-evidence/immutable/upload_result.json',encoding='utf-8')).get('metageneration',''))")
            ETAG=$(python -c "import json;print(json.load(open('release-evidence/immutable/upload_result.json',encoding='utf-8')).get('etag',''))")
            python -c "import json; p={'cloud_provider':'gcp','immutable_ref':'${URI}','bucket':'${BUCKET}','key':'${KEY}','generation':'${GENERATION}','metageneration':'${METAGENERATION}','etag':'${ETAG}','retention_days':'${RETENTION_DAYS}','retention_until_utc':'${RETENTION_UNTIL}'}; open('release-evidence/immutable/immutability_proof.json','w',encoding='utf-8').write(json.dumps(p,indent=2,sort_keys=True)+'\\n')"
          else
            echo "Unsupported cloud provider: ${PROVIDER}"
            exit 2
          fi
          echo "immutable_ref=$URI" >> "$GITHUB_OUTPUT"

      - name: Upload Release Evidence Pack
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence-${{ steps.pack.outputs.pack_id }}
          path: |
            release-evidence
            dist/evidence/${{ steps.pack.outputs.pack_id }}.zip
            dist/evidence/${{ steps.pack.outputs.pack_id }}/evidence_manifest.json
            dist/evidence/${{ steps.pack.outputs.pack_id }}/evidence_manifest.release_signer_a.sig.json
